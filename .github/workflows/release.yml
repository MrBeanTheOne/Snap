name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg
        # gyan.dev's essentials build (what choco repackages) straight from Gyan's GitHub mirror:
        # the choco feed 504'd for v4.13.0 and still exited 0 with "installed 0/0 packages"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R GyanD/codexffmpeg --pattern '*-essentials_build.zip' -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw 'ffmpeg.exe not in the download' }
          Add-Content $env:GITHUB_PATH $bin

      - name: Install dependencies
        # certifi is explicit: plain yt-dlp installs no deps, and updater.py needs the CA
        # bundle to reach GitHub on machines with a stale Windows cert store (v4.12.2)
        # curl_cffi: browser impersonation TikTok demands; yt-dlp only routes impersonated
        # requests through it (preference -100), so YouTube is untouched. <0.18 = yt-dlp's supported range
        run: pip install pywebview yt-dlp yt-dlp-ejs certifi mutagen pystray pillow pyinstaller "curl_cffi>=0.10,<0.18"

      - name: Self-check
        # offline: watch seeding, state safety, tagging fallbacks, updater swap + hashes, media server
        run: python test_app.py

      - name: Build
        run: python -m PyInstaller Snap.spec --noconfirm

      - name: Smoke-test the build
        # every broken release so far (choco ffmpeg shim, missing certifi) shipped a build
        # nobody had launched — check the bundled tools, then that the exe opens its window
        run: |
          foreach ($t in 'ffmpeg', 'ffprobe') {
            $v = & "dist/Snap/_internal/$t.exe" -version  # capture first: piping can cut the exe short
            if ($LASTEXITCODE) { throw "bundled $t does not run" }
            $v[0]
          }
          & dist/Snap/_internal/deno.exe --version
          if ($LASTEXITCODE) { throw 'bundled deno does not run' }
          if (-not (Test-Path dist/Snap/_internal/certifi/cacert.pem)) { throw 'certifi CA bundle missing' }
          if (-not (Test-Path dist/Snap/_internal/curl_cffi/_wrapper*.pyd)) { throw 'curl_cffi missing (TikTok needs it)' }
          $p = Start-Process dist/Snap/Snap.exe -PassThru
          Start-Sleep 20
          $p.Refresh()
          if ($p.HasExited) { throw "Snap.exe exited early (code $($p.ExitCode))" }
          $title = $p.MainWindowTitle  # a crash shows 'Unhandled exception in script' instead
          Stop-Process -Id $p.Id -Force
          if ($title -ne 'Snap') { throw "expected the Snap window, got '$title'" }
          "Snap.exe up with its window"

      - name: Zip
        run: Compress-Archive -Path dist/Snap -DestinationPath Snap-win64.zip

      - name: Install Inno Setup
        # the runner image ships it (6.7.x); choco only as a fallback — its feed was down for v4.13.0
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }

      - name: Installer
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          iscc /Qp "/DMyAppVersion=$v" installer.iss

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Snap-win64.zip
            dist/Snap-setup.exe
          generate_release_notes: true
